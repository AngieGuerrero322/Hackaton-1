<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>RESTAURANTE BACANISIMO</title>
</head>
<body>

    <header>
        <nav class="nav">

            <!-- LOGO -->
            <img class="nav__logo" src="IMAGENES/Logo.png" alt="Imagen Logo">

            <!-- CARRITO -->
            <ul class="nav__list">
                <li><a class="nav__link" href="#">Inicio</a></li>
                <li><a class="nav__link" href="#">Menu</a></li>
                <li><a class="nav__link" href="#">Promociones</a></li>
            </ul>

            <!-- OPCIONES -->
            <ul class="nav__list">
                <li class="nav__cart">🛒 <span class="nav__cart-counter">0</span></li>
            </ul>
        </nav>        
    </header>

    <main>
        <!-- Imagen representacion -->
        <img class="brand-letters" src="IMAGENES/Letras.png" alt="">

            <!-- OFERTAS -->
            <div class="offers">
                <button class="offers__button">🍔 Ver Menu completo</button>
                <button class="offers__button button--color">🎁 Ver promociones</button>
            </div>
        

        <!-- Productos -->

        <div class="products">

            <!-- PRODUCTO 1 -->
            <div class="product__card">
                <img class="product__img" src="https://i.postimg.cc/zXdBSvp1/Ajiaco.jpg" alt="">

                <div class="product__info">
                    <p class="product__info-title">AUDIFONOS</p>
                    <p class="product__info-description">Inalámbricos - Gran sonido</p>
                    <p class="product__price">$189.99</p>
                    <button class="product__button">🛒 Agregar al carrito</button>
                </div>                    
            </div>


            <!-- PRODUCTO 2 -->
            <div class="product__card">
                <img class="product__img" src="https://i.postimg.cc/CLv1H5Jg/Arrozconpollo.jpg" alt="">

                <div class="product__info">
                    <p class="product__info-title">AUDIFONOS</p>
                    <p class="product__info-description">Inalámbricos - Gran sonido</p>
                    <p class="product__price">$189.99</p>
                    <button class="product__button">🛒 Agregar al carrito</button>
                </div>                    
            </div>

        </div>
    </main> 
    
    <script type="module" src="scripts/app.js"></script>
</body>
</html>
